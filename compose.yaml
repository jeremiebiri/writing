services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: writer
      POSTGRES_DB: writing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    ports: ["127.0.0.1:${PG_PORT:-55432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "writer", "-d", "writing"]
      interval: 3s
      timeout: 3s
      retries: 20
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Copy .env.example to .env}
    ports: ["127.0.0.1:${NEO4J_PORT:-57687}:7687"]
    volumes: [neo4j_data:/data]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-56379}:6379"]
volumes:
  postgres_data:
  neo4j_data:
